{{- if .Values.webUISecret.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ .Values.webUISecret.eso.secretStore.name }}
    kind: {{ .Values.webUISecret.eso.secretStore.kind }}

  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: {{ .Values.webUISecret.eso.webUISecretRemoteRefKey }}
{{- end }}