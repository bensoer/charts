{{- if .Values.openRouterSecret.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-openrouter-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ .Values.openRouterSecret.eso.secretStore.name }}
    kind: {{ .Values.openRouterSecret.eso.secretStore.kind }}

  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.openRouterSecret.eso.apiKeyRemoteRefKey }}
{{- end }}