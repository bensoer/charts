{{- if .Values.terminalsSecret.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-terminals-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ .Values.terminalsSecret.eso.secretStore.name }}
    kind: {{ .Values.terminalsSecret.eso.secretStore.kind }}

  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.terminalsSecret.eso.terminalsSecretRemoteRefKey }}
{{- end }}