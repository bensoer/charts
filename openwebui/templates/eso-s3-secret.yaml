{{- if .Values.s3Secret.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-s3-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ .Values.s3Secret.eso.secretStore.name }}
    kind: {{ .Values.s3Secret.eso.secretStore.kind }}

  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.s3Secret.eso.s3AccessKeyIdRemoteRefKey }}
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.s3Secret.eso.s3SecretAccessKeyIdRemoteRefKey }}
    - secretKey: S3_REGION_NAME
      remoteRef:
        key: {{ .Values.s3Secret.eso.s3RegionNameRemoteRefKey }}
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: {{ .Values.s3Secret.eso.s3BucketNameRemoteRefKey }}
{{- end }}