{{- if .Values.configSecret.eso.enabled }}
{{- if .Values.configSecret.existingName }}
{{- fail "configSecret.existingName and configSecret.eso.enabled are mutually exclusive" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mcpo.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcpo.labels" . | nindent 4 }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: {{ required "configSecret.eso.secretStore.name is required" .Values.configSecret.eso.secretStore.name }}
    kind: {{ required "configSecret.eso.secretStore.kind is required" .Values.configSecret.eso.secretStore.kind }}
  target:
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.configSecret.key | quote }}
      remoteRef:
        key: {{ required "configSecret.eso.remoteRefKey is required when ESO is enabled" .Values.configSecret.eso.remoteRefKey | quote }}
{{- end }}
