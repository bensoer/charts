{{- if .Values.cnpgDatabase.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: agent-substrate-cluster
spec:
  instances: {{ .Values.cnpgDatabase.instances }}

  bootstrap:
    initdb:
      database: agentsubstrate
      owner: agentsubstrate

  storage:
    size: {{ .Values.cnpgDatabase.size }}
    storageClass: {{ .Values.cnpgDatabase.storageClass }}
{{- end }}