kaneo:
  postgresql:
    enabled: false # Do not use kaneo built in
  autoscaling:
    enabled: true

  kaneo:

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi

    extraEnv:
      - name: KANEO_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS
        value: 'true'
      - name: S3_FORCE_PATH_STYLE
        value: 'true'
      - name: SMTP_HOST
        value: smtp.sendgrid.net
      - name: SMTP_PORT
        value: "465"
      - name: SMTP_SECURE
        value: "true"
      - name: SMTP_FROM
        value: support@projectterris.com

    extraEnvFrom:
      - secretRef:
          name: kaneo-credentials

    env:
      clientUrl: https://kaneo.intra.soernet.ca
      disableRegistration: 'true'
      # AUTH_SECRET using an existing one instead
      existingSecret:
        enabled: true
        name: kaneo-auth-secret
        key: auth-secret
      database:
        external:
          enabled: true
          existingSecret:
            enabled: true
            name: kaneo-cluster-app
            passwordKey: uri

cnpgDatabase:
  enabled: true
  storageClass: synology-nas-csi-iscsi-retain
  size: 10Gi
  instances: 1

traefik:
  ingressRoute:
    enabled: true
    domain: kaneo.intra.soernet.ca
    issuer: letsencrypt-prod-cluster-issuer
    issuerKind: ClusterIssuer

authSecret:
  eso:
    enabled: true
    secretStore:
      name: aws-use1-parameter-store-cluster-secret-store
      kind: ClusterSecretStore
    remoteRefKey: /k3s-homelab/kaneo/credentials/auth_secret

credentialsSecret:
  eso:
    enabled: true
    secretStore:
      name: aws-use1-parameter-store-cluster-secret-store
      kind: ClusterSecretStore
    data:
      S3_ACCESS_KEY_ID: /k3s-homelab/kaneo/s3/access_key
      S3_SECRET_ACCESS_KEY: /k3s-homelab/kaneo/s3/secret_key
      S3_REGION: /k3s-homelab/kaneo/s3/region
      S3_BUCKET: /k3s-homelab/kaneo/s3/bucket
      S3_ENDPOINT: /k3s-homelab/kaneo/s3/endpoint_url
      SMTP_USER: /k3s-homelab/kaneo/smtp/username
      SMTP_PASSWORD: /k3s-homelab/kaneo/smtp/password
      # Custom OAuth/OIDC Configuration
      CUSTOM_OAUTH_CLIENT_ID: /k3s-homelab/kaneo/oauth/client_id
      CUSTOM_OAUTH_CLIENT_SECRET: /k3s-homelab/kaneo/oauth/client_secret
      CUSTOM_OAUTH_DISCOVERY_URL: /k3s-homelab/kaneo/oauth/openid_connect_config_url