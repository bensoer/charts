{{- if .Values.authSecret.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kaneo-auth-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ .Values.authSecret.eso.secretStore.name }}
    kind: {{ .Values.authSecret.eso.secretStore.kind }}

  data:
    - secretKey: auth-secret
      remoteRef:
        key: {{ .Values.authSecret.eso.remoteRefKey }}
{{- end }}