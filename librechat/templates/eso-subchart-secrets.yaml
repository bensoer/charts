{{- /*
ExternalSecrets for credentials the bundled subcharts (bitnami mongodb /
redis) need as PRE-EXISTING Secrets, so the charts skip rendering their own
helm-generated Secret (see the auth.existingSecret notes in values.yaml).

Keyed by target Secret name (which must match what the subcharts and the
upstream app templates resolve via their secretName helpers):
  librechat-mongodb -> key mongodb-root-password (bitnami mongodb root user)
  librechat-redis   -> key redis-password      (bitnami redis auth)

Values come from Parameter Store, so they are stable across ArgoCD syncs
(the reason helm-generated randAlphaNum passwords cannot be used here).
*/}}
{{- if and .Values.credentialsSecret.eso.enabled .Values.credentialsSecret.eso.subchartSecrets }}
{{- range $secretName, $keys := .Values.credentialsSecret.eso.subchartSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ $.Values.credentialsSecret.eso.secretStore.name }}
    kind: {{ $.Values.credentialsSecret.eso.secretStore.kind }}

  data:
    {{- range $secretKey, $remoteRefKey := $keys }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteRefKey }}
    {{- end }}
---
{{- end }}
{{- end }}