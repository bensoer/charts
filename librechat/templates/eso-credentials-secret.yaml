{{- if .Values.credentialsSecret.eso.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-credentials-env
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    name: {{ .Values.credentialsSecret.eso.secretStore.name }}
    kind: {{ .Values.credentialsSecret.eso.secretStore.kind }}

  # Every synced key becomes an environment variable in the librechat pod
  # through global.librechat.existingSecretName (envFrom secretRef), and
  # MEILI_MASTER_KEY authenticates the bundled Meilisearch through
  # meilisearch.auth.existingMasterKeySecret.
  # The upstream chart requires this Secret to exist before the pod starts.
  data:
    {{- range $secretKey, $remoteRefKey := .Values.credentialsSecret.eso.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteRefKey }}
    {{- end }}
{{- end }}